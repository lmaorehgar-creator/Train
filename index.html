<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>20424 Patalkot Express Tracker</title>
<style>
:root{--bg:#f4f5f7;--fg:#1d2127;--card:#fff;--muted:#6b7280;--map:#e8eaed;--accent:#1a73e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--fg:#eceff3;--card:#1f242b;--muted:#98a2b3;--map:#262b33;--accent:#6ea8fe;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--fg:#eceff3;--card:#1f242b;--muted:#98a2b3;--map:#262b33;--accent:#6ea8fe;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:720px;margin:0 auto;padding:10px}
h1{font-size:16px;margin:2px 0 8px;display:flex;justify-content:space-between;align-items:center}
h1 span{color:var(--muted);font-weight:400;font-size:12px}
.map{position:relative;border-radius:14px;overflow:hidden;background:var(--map);height:56vh;min-height:300px}
canvas{width:100%;height:100%;display:block}
.fab{position:absolute;right:8px;display:flex;flex-direction:column;gap:6px}
.fab button{width:36px;height:36px;border-radius:50%;font-size:18px;padding:0}
.top{position:absolute;left:8px;top:8px;right:60px;background:var(--card);border-radius:10px;padding:8px 10px;box-shadow:0 1px 4px #0003}
.top b{font-size:15px}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.card{background:var(--card);border-radius:12px;padding:10px 12px}
.card small{color:var(--muted);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.card .v{font-size:20px;font-weight:600}
.speed{grid-row:span 2;display:flex;flex-direction:column;justify-content:center;align-items:center}
.speed .v{font-size:52px;line-height:1}
button,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid #8884;border-radius:8px;padding:6px 10px}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.bar{height:6px;background:#8883;border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.note{color:var(--muted);font-size:11px;margin-top:8px}
</style></head><body>
<h1>🚆 20424 Patalkot Express <span>Firozpur Cantt → Seoni</span></h1>
<div class="map"><canvas id="c"></canvas>
<div class="top"><small id="st" style="color:var(--muted)">Next stop</small><br><b id="nx">–</b> <span id="nd" style="color:var(--muted)"></span></div>
<div class="fab"><button id="zi">+</button><button id="zo">−</button><button id="vm" title="Follow / full route">⤢</button></div></div>
<div class="hud">
<div class="card speed"><small>Speed</small><div class="v" id="sp">0</div><small>km/h</small></div>
<div class="card"><small>To next stop</small><div class="v" id="dn">–</div></div>
<div class="card"><small>To Seoni</small><div class="v" id="rm">–</div></div>
</div>
<div class="bar"><i id="pb"></i></div>
<div class="row"><button id="mD" class="on">Demo run</button><button id="mG">My GPS</button>
<span id="demoCtl" class="row" style="margin:0"><button data-w="1">×1</button><button data-w="10">×10</button><button data-w="60" class="on">×60</button><button data-w="300">×300</button><select id="jump"></select></span></div>
<div class="note" id="msg">Demo run: simulated train on the 1,492 km route (elapsed <span id="el">0:00</span>). Map tiles can’t load here, so the route is drawn from major stations only (approximate).</div>
<script>
const ST=[["Firozpur Cantt",30.938,74.613,2],["Faridkot",30.670,74.758,2],["Kotkapura",30.583,74.833,2],["Bathinda",30.210,74.945,25],["Mansa",29.987,75.393,2],["Jakhal",29.801,75.829,2],["Jind",29.316,76.313,2],["Rohtak",28.895,76.580,2],["Delhi Sarai Rohilla",28.663,77.185,5],["H. Nizamuddin",28.588,77.253,3],["Mathura",27.480,77.684,3],["Agra Cantt",27.159,77.988,3],["Gwalior",26.219,78.184,3],["Jhansi",25.442,78.580,5],["Bina",24.182,78.201,3],["Bhopal",23.267,77.413,5],["Itarsi",22.611,77.763,5],["Betul",21.907,77.900,3],["Amla",21.922,78.122,2],["Chhindwara",22.060,78.940,5],["Seoni",22.085,79.540,0]];
const n=ST.length,TOT=1492000,rad=Math.PI/180;
const hv=(a,b)=>{const dl=(b[1]-a[1])*rad,dp=(b[0]-a[0])*rad,x=Math.sin(dp/2)**2+Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dl/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
let D=[0];for(let i=1;i<n;i++)D[i]=D[i-1]+hv(ST[i-1].slice(1),ST[i].slice(1));
const K=TOT/D[n-1];D=D.map(x=>x*K);
function at(s){s=Math.max(0,Math.min(TOT,s));let i=0;while(i<n-2&&D[i+1]<s)i++;const t=(s-D[i])/(D[i+1]-D[i]);return[ST[i][1]+(ST[i+1][1]-ST[i][1])*t,ST[i][2]+(ST[i+1][2]-ST[i][2])*t]}
const xy=(p,c)=>[(p[1]-c[1])*Math.cos(c[0]*rad)*111320,(p[0]-c[0])*110540];
const brg=(a,b)=>{const[x,y]=xy(b,a);return Math.atan2(x,y)};
let s=0,v=0,nextI=1,dwell=0,el=0,fin=false,mode="demo",warp=60,full=false,zi=2,hd=0,off=0;
const MPP=[25,60,150,400,1000];
const cv=document.getElementById("c"),cx=cv.getContext("2d"),$=id=>document.getElementById(id);
const jump=$("jump");jump.innerHTML='<option value="">Jump to…</option>'+ST.map((t,i)=>`<option value="${i}">${t[0]}</option>`).join("");
jump.onchange=()=>{if(jump.value==="")return;const i=+jump.value;s=D[i];v=0;dwell=0;fin=false;nextI=Math.min(i+1,n-1);if(i===n-1){fin=true;nextI=n-1}jump.value=""};
function step(dt){
 el+=dt;
 if(dwell>0){dwell-=dt;v=0;if(dwell<=0){dwell=0;nextI++}return}
 if(fin){v=0;return}
 const dN=D[nextI]-s,vmax=(110-8*Math.sin(s/20000))/3.6,vt=Math.min(vmax,Math.sqrt(2*.55*Math.max(dN,0)));
 v=v<vt?Math.min(vt,v+.5*dt):Math.max(vt,v-.8*dt);
 s+=v*dt;
 if(dN<20&&v<2){s=D[nextI];v=0;if(nextI===n-1)fin=true;else dwell=ST[nextI][3]*60}
}
let gl=null,ls=null,lt=null;
function startGPS(){
 if(!navigator.geolocation){$("msg").textContent="GPS isn’t available in this browser.";return setMode("demo")}
 $("msg").textContent="Waiting for GPS…";
 gl=navigator.geolocation.watchPosition(p=>{
  const u=[p.coords.latitude,p.coords.longitude];let best=1e12,bs=0;
  for(let i=0;i<n-1;i++){const a=ST[i].slice(1),b=ST[i+1].slice(1),[bx,by]=xy(b,a),[ux,uy]=xy(u,a),L=bx*bx+by*by;let t=Math.max(0,Math.min(1,(ux*bx+uy*by)/L));const dd=Math.hypot(ux-bx*t,uy-by*t);if(dd<best){best=dd;bs=D[i]+t*(D[i+1]-D[i])}}
  const now=p.timestamp/1000;
  if(p.coords.speed!=null&&!isNaN(p.coords.speed))v=p.coords.speed;else if(lt&&now-lt>1)v=Math.abs(bs-ls)/(now-lt);
  ls=bs;lt=now;s=bs;off=best;dwell=0;fin=bs>TOT-100;nextI=Math.min(n-1,Math.max(1,D.findIndex(d=>d>s+50)));
  $("msg").textContent=best>3000?`You’re ${(best/1000).toFixed(0)} km from the track, so the position is snapped to the nearest point on the route.`:"Tracking your GPS position on the track.";
 },e=>{$("msg").textContent="GPS blocked or unavailable ("+e.message+"). Showing the demo run instead.";setMode("demo")},{enableHighAccuracy:true,maximumAge:2000});
}
function setMode(m){mode=m;$("mD").classList.toggle("on",m==="demo");$("mG").classList.toggle("on",m==="gps");$("demoCtl").style.display=m==="demo"?"flex":"none";
 if(gl!=null){navigator.geolocation.clearWatch(gl);gl=null}
 if(m==="gps")startGPS();else{v=0;dwell=0;$("msg").innerHTML='Demo run: simulated train on the 1,492 km route (elapsed <span id="el">0:00</span>). Approximate stations only.'}}
$("mD").onclick=()=>setMode("demo");$("mG").onclick=()=>setMode("gps");
document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{warp=+b.dataset.w;document.querySelectorAll("[data-w]").forEach(x=>x.classList.toggle("on",x===b))});
$("zi").onclick=()=>{zi=Math.max(0,zi-1)};$("zo").onclick=()=>{zi=Math.min(MPP.length-1,zi+1)};$("vm").onclick=()=>{full=!full;$("vm").classList.toggle("on",full)};
const css=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const path=(pts,col,w)=>{if(pts.length<2)return;cx.lineCap=cx.lineJoin="round";cx.beginPath();pts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.strokeStyle=css("--card");cx.lineWidth=w+4;cx.stroke();cx.strokeStyle=col;cx.lineWidth=w;cx.stroke()};
function draw(){
 const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
 if(cv.width!==W*dpr||cv.height!==H*dpr){cv.width=W*dpr;cv.height=H*dpr}
 cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle=css("--map");cx.fillRect(0,0,W,H);
 const P=at(s);let c,th=0,sc,aY;
 if(full){c=[26.5,77];th=0;sc=Math.min(W/560000,H/1050000)*.9;aY=H/2;c=[(30.938+21.907)/2,(74.613+79.54)/2]}
 else{c=P;const a=brg(at(s-300),at(s+700));let d=a-hd;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;hd+=d*.15;th=hd;sc=1/MPP[zi];aY=H*.72}
 const T=p=>{const[x,y]=xy(p,c);return[W/2+(x*Math.cos(th)-y*Math.sin(th))*sc,aY-(x*Math.sin(th)+y*Math.cos(th))*sc]};
 const behind=[],ahead=[];ST.forEach((t,i)=>{(D[i]<=s?behind:ahead).push(i)});
 const bp=behind.map(i=>ST[i].slice(1)).concat([P]).map(T),ap=[P].concat(ahead.map(i=>ST[i].slice(1))).map(T);
 path(bp,"#9aa0a6",full?4:8);path(ap,"#1a73e8",full?4:8);
 cx.font="12px system-ui,sans-serif";cx.textBaseline="middle";
 ST.forEach((t,i)=>{const[x,y]=T(t.slice(1));if(x<-20||x>W+20||y<-20||y>H+20)return;
  cx.beginPath();cx.arc(x,y,full?3.5:5,0,7);cx.fillStyle="#fff";cx.fill();cx.lineWidth=2;cx.strokeStyle=D[i]<=s?"#9aa0a6":"#1a73e8";cx.stroke();
  cx.lineWidth=3;cx.strokeStyle=css("--map");cx.strokeText(t[0],x+9,y);cx.fillStyle=css("--fg");cx.fillText(t[0],x+9,y)});
 const[px,py]=T(P),r=full?10:17;
 cx.beginPath();cx.arc(px,py,r,0,7);cx.fillStyle="#1a73e8";cx.fill();cx.lineWidth=3;cx.strokeStyle="#fff";cx.stroke();
 cx.font=(full?12:19)+"px system-ui,sans-serif";cx.textAlign="center";cx.fillStyle="#fff";cx.fillText("🚆",px,py+1);cx.textAlign="left";
 // HUD
 const nI=Math.min(nextI,n-1),dN=Math.max(0,D[nI]-s);
 $("sp").textContent=Math.round(v*3.6);
 $("nx").textContent=ST[nI][0];
 $("st").textContent=fin?"Arrived":dwell>0?"Halted — departs in "+Math.ceil(dwell/60)+" min":"Next stop";
 $("nd").textContent=fin?"":"· ETA "+(dN/Math.max(v,22)/60).toFixed(0)+" min";
 $("dn").textContent=(dN/1000).toFixed(1)+" km";
 $("rm").textContent=((TOT-s)/1000).toFixed(0)+" km";
 $("pb").style.width=(s/TOT*100)+"%";
 const e=$("el");if(e){const m=Math.floor(el/60);e.textContent=Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"}
}
let last=performance.now();
(function loop(t){const dt=Math.min(.1,(t-last)/1000);last=t;
 if(mode==="demo"){let sim=dt*warp;while(sim>0){const d=Math.min(2,sim);step(d);sim-=d}}
 draw();requestAnimationFrame(loop)})(last);
</script></body></html>
